<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="RegisterConductor.css">
</head>
<body>


  <div class="fondo">


    <div class="fondo-color"></div>


    <div class="container-encuesta">

      <div class="box-encuesta">

        <a href="/inicio/index.html">
        <img src="1774225985813.png" alt="Green Move" class="logo">
        </a>  

        <h1 class="titulo">Registrarse</h1>
        <p class="subtitulo">Crea una cuenta para empezar</p>


        <form class="encuesta">

          <div class="encuesta-row">
            <input type="text" placeholder="Nombre">
            <input type="text" placeholder="Apellido">
          </div>

          <input type="email" placeholder="Correo Electrónico">

          <div class="encuesta-row">
            <input type="text" placeholder="Teléfono">
            <input type="password" placeholder="Contraseña">
          </div>

          <input type="text" placeholder="Placa del Vehículo">


          <div class="condiciones">
            <input type="checkbox" id="terminos">
            <label for="terminos">
            Acepto los<span>Términos y Condiciones</span>
            </label>
          </div>

          <button type="submit" class="registerButton">Registrarse</button>

          <p class="login">
          ¿Eres pasajero? 
          <a href="/UnionConductores/RegistrarPasajeroGm/RegistrarPasajeroGM.html">Registrarse aquí</a>
          </p>
         
        </form>

      </div>

    </div>

  </div>
  <script src="RegisterConductor.js"></script>

</body>
</html>
