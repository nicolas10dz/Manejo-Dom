<svg width="120" height="120" viewBox="0 0 100 100">
  <defs>
    <!-- efecto glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .wheel {
      fill: none;
      stroke: #39ff14; /* verde neón */
      stroke-width: 6;
      animation: spin 4s linear infinite;
      transform-origin: 50% 50%;
      filter: url(#neonGlow);
    }

    .inner {
      stroke: #39ff14;
      stroke-width: 4;
      filter: url(#neonGlow);
    }

    .center {
      fill: #39ff14;
      filter: url(#neonGlow);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- círculo exterior -->
  <circle cx="50" cy="50" r="35" class="wheel"/>

  <!-- centro -->
  <circle cx="50" cy="50" r="8" class="center"/>

  <!-- radios -->
  <line x1="50" y1="50" x2="50" y2="20" class="inner"/>
  <line x1="50" y1="50" x2="25" y2="65" class="inner"/>
  <line x1="50" y1="50" x2="75" y2="65" class="inner"/>
</svg>