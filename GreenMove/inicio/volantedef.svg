<svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- gris moderno -->
    <linearGradient id="grayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>

  <style>
    .wheel {
      fill: none;
      stroke: url(#grayGradient);
      stroke-width: 6;
      animation: spin 4s linear infinite;
      transform-origin: 50% 50%;
    }

    .inner {
      stroke: url(#grayGradient);
      stroke-width: 4;
    }

    .center {
      fill: url(#grayGradient);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- círculo exterior -->
  <circle cx="50" cy="50" r="35" class="wheel"/>

  <!-- centro -->
  <circle cx="50" cy="50" r="8" class="center"/>

  <!-- radios -->
  <line x1="50" y1="50" x2="50" y2="20" class="inner"/>
  <line x1="50" y1="50" x2="25" y2="65" class="inner"/>
  <line x1="50" y1="50" x2="75" y2="65" class="inner"/>

</svg>