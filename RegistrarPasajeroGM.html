<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/RegistrarPasajeroGM.css">
</head>
<body>



  <div class="fondo">
    <div class="fondo-color"></div>

    <div class="container-encuesta">
      <div class="box-encuesta">

        <img src="/1774225985813.png" alt="Green Move" class="logo">

        <h1 class="titulo">Registrarse</h1>
        <p class="subtitulo">Crea una cuenta para empezar</p>

        <form class="encuesta">

          <div class="encuesta-row">
            <input type="text" id="nombre" placeholder="Nombre">
            <input type="text" id="apellido" placeholder="Apellido">
          </div>

          <input type="email" id="email" placeholder="Correo Electrónico">

          <div class="encuesta-row">
            <input type="text" id="telefono" placeholder="Teléfono">

            <input type="password" id="password" placeholder="Contraseña">
          </div>


          <input type="password" id="confirmarPassword" placeholder="Confirmar Contraseña">

          <div class="condiciones">
            <label>
              <input type="checkbox" id="terminos">
              Acepto los <span>Términos y Condiciones</span>
            </label>
          </div>

          <button class="registerButton">Registrarse</button>


          <p class="login">
            ¿Eres conductor? <span>Registrarse aquí</span>
          </p>

        </form>

          <div class="box-redes">          
            <img src="/facebool.webp" alt="face" class="Redes">
           <img src="/IG.webp" alt="google" class="Redes">
          </div>


      </div>
    </div>
  </div>






    <script src="/RegistrarPasajeroGM.js"></script>
</body>
</html>
